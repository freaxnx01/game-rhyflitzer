name: Tests

on:
  pull_request:        # every PR into any branch; no paths filter, a required check that never reports blocks the merge forever
  workflow_dispatch:
    inputs:
      all:
        description: "Run every browser test file, not just the ones the diff affects"
        type: boolean
        default: false
      hosted:
        description: "Use GitHub-hosted runners (SwiftShader) even though the GPU runners could take the job"
        type: boolean
        default: false
  schedule:
    - cron: "30 2 * * *"   # #389: the whole suite on main every night; the nightly job files the red tests

permissions:           # pull-requests/issues write: the Visual-tests PR comment (#332). A fork PR gets a read-only token, the recorder only warns.
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: tests-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.63.0"
  MAX_SHARDS: 8          # browser-test jobs in parallel; public repos get 20 hosted jobs at once
  MAX_SHARDS_GPU: 2      # one per homelab GPU runner (#369); each runs one job at a time
  TESTS_PER_SHARD: 3     # fewer tests than this per job aren't worth another Chromium install

jobs:
  # Node tests, the test selection (#330) and the split: the selected files are collected into test ids, which are dealt
  # round-robin onto up to MAX_SHARDS jobs, so one slow file (test_hideout.py) no longer fills a single 30-minute job.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      count: ${{ steps.split.outputs.count }}
      shards: ${{ steps.split.outputs.shards }}
      runner: ${{ steps.runner.outputs.labels }}
      gpu: ${{ steps.runner.outputs.gpu }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # the diff base (origin/<base branch>) must be available

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          node-version: "24"

      - name: Node tests
        run: node --test prototype/tests/*.test.mjs

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt pytest pillow "playwright==${PLAYWRIGHT_VERSION}"

      - name: Select the affected browser tests
        env:
          BASE_REF: ${{ github.base_ref }}
          ALL: ${{ inputs.all || github.event_name == 'schedule' }}   # #389: the nightly run takes every file
        run: |
          if [ "$ALL" = true ]; then
            ls prototype/tests/test_*.py > "$RUNNER_TEMP/selected.txt"
            cat "$RUNNER_TEMP/selected.txt"
            exit 0
          fi
          base="origin/${BASE_REF:-main}"
          git diff --name-only "$base"...HEAD \
            | python prototype/tests/select_tests.py select --summary "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/selected.txt"
          cat "$RUNNER_TEMP/selected.txt"

      # #369: the homelab GPU runners take runs from this repo's own branches only. A fork PR never reaches them: it
      # stays on ubuntu-latest. The runners keep nothing between jobs and can't reach the LAN (mydocker-compose,
      # services/gh-runner-gpu); agent-workflow#548 records why this public repo may use them for tests.
      - name: Pick the runners
        id: runner
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          HOSTED: ${{ inputs.hosted }}
        run: |
          gpu=false
          if [ "$HOSTED" != true ]; then
            if [ "$EVENT" = workflow_dispatch ] || { [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$REPO" ]; }; then gpu=true; fi
          fi
          if [ "$gpu" = true ]; then labels='["self-hosted","gpu-browser"]'; else labels='["ubuntu-latest"]'; fi
          echo "gpu=$gpu" >> "$GITHUB_OUTPUT"; echo "labels=$labels" >> "$GITHUB_OUTPUT"; echo "browser tests on $labels"

      - name: Split the tests into shards
        id: split
        env:
          GPU: ${{ steps.runner.outputs.gpu }}
        run: |
          [ "$GPU" = true ] && MAX_SHARDS=$MAX_SHARDS_GPU
          : > ids.txt
          if grep -q . "$RUNNER_TEMP/selected.txt"; then
            python -m pytest --collect-only -q $(cat "$RUNNER_TEMP/selected.txt") | grep '::' > ids.txt || true
          fi
          count=$(grep -c . ids.txt || true)
          shards=$(( (count + TESTS_PER_SHARD - 1) / TESTS_PER_SHARD ))
          [ "$shards" -gt "$MAX_SHARDS" ] && shards=$MAX_SHARDS
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "shards=$(python -c "import json, sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$shards")" >> "$GITHUB_OUTPUT"
          echo "$count browser tests in $shards shards"
          [ "$count" = 0 ] && echo "no browser tests affected"
          true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: steps.split.outputs.count != '0'
        with:
          name: test-ids
          path: ids.txt
          retention-days: 1

  browser:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ fromJSON(needs.plan.outputs.runner) }}
    timeout-minutes: 30
    env:
      GPU: ${{ needs.plan.outputs.gpu }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        if: env.GPU != 'true'   # the GPU runner image has Python, the requirements, Playwright and Chromium baked in
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        if: env.GPU != 'true'
        run: pip install -r pipeline/requirements.txt pytest pillow "playwright==${PLAYWRIGHT_VERSION}"

      - name: Cache the Playwright browsers
        if: env.GPU != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Chromium
        if: env.GPU != 'true'
        run: python -m playwright install --with-deps chromium

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: test-ids

      - name: This shard's tests
        env:
          SHARDS: ${{ strategy.job-total }}
          SHARD: ${{ matrix.shard }}
        run: |
          awk -v n="$SHARDS" -v k="$SHARD" '(NR - 1) % n == k' ids.txt > "$RUNNER_TEMP/mine.txt"
          cat "$RUNNER_TEMP/mine.txt"

      - name: Start Chromium on the GPU
        if: env.GPU == 'true'
        run: echo "PW_CDP_ENDPOINT=$(start-gpu-chrome)" >> "$GITHUB_ENV"   # the tests' GPU-browser hook (#324)

      - name: Browser tests
        env:
          GH_TOKEN: ${{ github.token }}
        # @file: one test id per line, so parametrised ids with spaces stay whole
        run: python -m pytest "@$RUNNER_TEMP/mine.txt" -v --junitxml="$RUNNER_TEMP/junit.xml"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: junit-${{ matrix.shard }}
          path: ${{ runner.temp }}/junit.xml
          retention-days: 7
          if-no-files-found: ignore

  tests:
    name: tests        # the required-check name: do not rename without updating the ruleset
    needs: [plan, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: needs.plan.outputs.count != '0'
        with:
          pattern: junit-*
          path: junit

      - name: Durations
        if: needs.plan.outputs.count != '0'
        run: |
          for f in junit/*/junit.xml; do
            [ -f "$f" ] || continue
            echo "### $(basename "$(dirname "$f")")" >> "$GITHUB_STEP_SUMMARY"
            python3 prototype/tests/select_tests.py durations "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Result
        env:
          PLAN: ${{ needs.plan.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "plan: $PLAN, browser: $BROWSER"
          [ "$PLAN" = success ] && { [ "$BROWSER" = success ] || [ "$BROWSER" = skipped ]; }

  # #389: on the scheduled full run, one issue per red test that no open issue covers yet (prototype/tests/nightly_report.py)
  nightly:
    needs: [plan, browser, tests]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true   # no junit at all is a broken night, and the report says so
        with:
          pattern: junit-*
          path: junit

      - name: File the red tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: python3 prototype/tests/nightly_report.py junit
