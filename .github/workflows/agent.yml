name: Claude
on:
  issues:
    types: [labeled]

permissions:            # a reusable workflow can't be granted more than its
  contents: write       # caller; the repo's default GITHUB_TOKEN is read-only,
  pull-requests: write  # so omitting this fails the run at startup_failure.
  issues: write
  actions: write        # retry-dispatch.sh re-dispatches THIS workflow; without
                        # it every retry 403s and transient failures go hard

jobs:
  claude:
    if: github.event.label.name == 'ai-implement'
    uses: freaxnx01/agent-workflow/.github/workflows/agent-implement.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # without it the pipeline silently falls back to claude
    with:
      issue-number: ${{ github.event.issue.number }}
      runner-labels: '["ubuntu-latest"]'
      default-model: z-ai/glm-5.2  # implementation on OpenRouter; design issues get labels agent:claude + model:fable
      pipeline-ref: v2
      agent: opencode
      review-model: claude-sonnet-5  # review runs on the claude CLI; Sonnet instead of the Opus default
      timeout-minutes: 120        # whole job; a 6-task plan with browser tests needs far more than the default 30
      claude-timeout-minutes: 100 # the claude process itself; the action's own default is 10 and killed the first #8 run
      ai-review-human-merge: true # with the issue label of the same name: the pipeline reviews its own draft PR and promotes it to ready on approve; a human merges
      self-fix: true              # on request_changes the implementing agent (GLM) fixes the findings, Sonnet re-reviews; max 2 rounds
